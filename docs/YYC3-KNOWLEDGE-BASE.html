<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YYC³ 知识库 · 项目资产看板</title>
<meta name="description" content="YYC³ Knowledge Base — 24 类 · 386 个项目资产看板">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-size='30' font-family='-apple-system,sans-serif' font-weight='700' fill='%23fff' text-anchor='middle'%3EY%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0a0f; --bg2:#12121a; --bg3:#1a1a2e;
  --surface:rgba(255,255,255,.03); --surface-hover:rgba(255,255,255,.06);
  --border:rgba(255,255,255,.08); --border-hover:rgba(255,255,255,.15);
  --text:#f1f1f6; --text2:rgba(255,255,255,.65); --text3:rgba(255,255,255,.35);
  --accent-v:#8b5cf6; --accent-c:#06b6d4; --accent-e:#22c55e;
  --accent-r:#ef4444; --accent-o:#f59e0b; --accent-p:#ec4899;
  --radius:14px; --radius-sm:8px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  --font-mono:'SF Mono','Fira Code','Cascadia Code','JetBrains Mono',Consolas,monospace;
}
html[data-theme="light"]{
  --bg:#f5f5f0; --bg2:#e8e8e3; --bg3:#ddd;
  --surface:rgba(0,0,0,.02); --surface-hover:rgba(0,0,0,.05);
  --border:rgba(0,0,0,.08); --border-hover:rgba(0,0,0,.15);
  --text:#1a1a2e; --text2:rgba(0,0,0,.55); --text3:rgba(0,0,0,.3);
  --shadow:0 4px 24px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
::selection{background:rgba(139,92,246,.35)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border-hover);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
a{color:var(--accent-c);text-decoration:none}
.app{display:flex;min-height:100vh}

/* ===== Sidebar ===== */
.sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;background:var(--bg2);border-right:1px solid var(--border);
  display:flex;flex-direction:column;z-index:100;transition:transform .3s ease}
.sidebar.hidden{transform:translateX(-100%)}
.sb-head{padding:20px 18px 12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--accent-v),var(--accent-c));
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:18px;flex:none}
.logo-t1{font-size:15px;font-weight:700;letter-spacing:.3px}
.logo-t2{font-size:11px;color:var(--text3)}
.sb-search{margin-top:14px}
.sb-search input{width:100%;padding:9px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:var(--font);font-size:13px;outline:none}
.sb-search input:focus{border-color:var(--accent-v)}
.sb-progress{padding:12px 18px;border-bottom:1px solid var(--border)}
.sp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--text3);margin-bottom:6px}
.sp-bar{height:6px;border-radius:6px;background:var(--bg3);overflow:hidden}
.sp-fill{height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--accent-v),var(--accent-c));transition:width .6s ease}
.sb-nav{flex:1;overflow-y:auto;padding:10px 10px 20px}
.nav-group{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--text3);padding:10px 8px 6px}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--radius-sm);cursor:pointer;
  color:var(--text2);font-size:12.5px;transition:.2s;border:1px solid transparent;text-decoration:none}
.nav-item:hover{background:var(--surface-hover);color:var(--text)}
.nav-item.active{background:var(--surface-hover);color:var(--text);border-color:var(--border)}
.nav-item.jump{margin-top:4px;border:1px dashed var(--border)}
.nav-dot{width:8px;height:8px;border-radius:50%;flex:none}
.nav-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-count{font-size:10px;color:var(--text3);font-family:var(--font-mono)}
.sb-foot{padding:12px 18px;border-top:1px solid var(--border);font-size:10.5px;color:var(--text3)}

/* ===== Main ===== */
.main{flex:1;margin-left:280px;min-width:0;transition:margin-left .3s ease}
.main.wide{margin-left:0}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:10px;padding:12px 22px;
  background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.icon-btn{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);background:var(--surface);
  color:var(--text2);display:grid;place-items:center;cursor:pointer;font-size:15px;transition:.2s;text-decoration:none;flex:none}
.icon-btn:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-hover)}
.icon-btn.lang{font-size:11px;font-weight:700;letter-spacing:.5px}
.tb-title{flex:1;min-width:0}
.tb-title h1{margin:0;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title p{margin:0;font-size:11px;color:var(--text3)}
.tb-clock{font-family:var(--font-mono);font-size:12px;color:var(--text3)}
/* 顶栏搜索：侧边栏收起后自动显示 */
.tb-search{display:none;flex:1;min-width:0;max-width:520px}
.tb-search.show{display:block}
.tb-search input{width:100%;padding:8px 12px;border-radius:var(--radius-sm);border:1px solid var(--border);
  background:var(--bg2);color:var(--text);font-family:var(--font);font-size:12.5px;outline:none}
.tb-search input:focus{border-color:var(--accent-v)}
.content{max-width:1440px;margin:0 auto;padding:24px 22px 60px}

/* ===== Hero ===== */
.hero{position:relative;overflow:hidden;border-radius:var(--radius);padding:30px 28px;margin-bottom:22px;
  background:linear-gradient(135deg,rgba(139,92,246,.16),rgba(6,182,212,.10) 55%,transparent);
  border:1px solid var(--border)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(139,92,246,.35),transparent 70%);animation:pulse 8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:700;letter-spacing:.3px}
.hero p{margin:0;color:var(--text2);font-size:13px}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.hero-tag{font-size:11px;padding:3px 10px;border-radius:999px;border:1px solid var(--border);color:var(--text2);background:var(--surface)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:20px;position:relative;z-index:1}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px}
.stat .k{font-size:11px;color:var(--text3);margin-bottom:4px}
.stat .v{font-size:22px;font-weight:700;font-family:var(--font-mono)}
.stat .u{font-size:11px;color:var(--text3);margin-left:2px}

/* ===== Filter bar ===== */
.filterbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 18px}
.chip{padding:6px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
  color:var(--text2);font-size:12px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--border-hover);color:var(--text)}
.chip.active{background:linear-gradient(135deg,var(--accent-v),var(--accent-c));border-color:transparent;color:#fff;font-weight:600}
.filterbar .spacer{flex:1}
select.sel{padding:6px 10px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg2);
  color:var(--text);font-family:var(--font);font-size:12px;outline:none;cursor:pointer}

/* ===== Category section ===== */
.cat-sec{margin-bottom:26px;scroll-margin-top:70px}
.cat-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.cat-bar{width:4px;height:22px;border-radius:4px}
.cat-head h3{margin:0;font-size:16px;font-weight:650}
.cat-desc{color:var(--text3);font-size:11.5px}
.cat-meta{margin-left:auto;font-size:11px;color:var(--text3);font-family:var(--font-mono)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}

/* ===== Card (multi-level) ===== */
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 16px 12px;transition:.25s ease;animation:fadeUp .4s ease both;overflow:hidden}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:hover{transform:translateY(-2px);border-color:var(--border-hover);box-shadow:var(--shadow)}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--c)}
.c-head{display:flex;align-items:flex-start;gap:10px;margin-top:4px}
.c-icon{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.c-title{flex:1;min-width:0}
.c-name{font-size:13.5px;font-weight:600;line-height:1.35;word-break:break-word;overflow-wrap:anywhere}
.c-sub{font-size:10.5px;color:var(--text3);margin-top:2px}
.c-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-hover);cursor:pointer;flex:none;
  display:grid;place-items:center;font-size:10px;color:transparent;transition:.2s}
.c-dot:hover{border-color:var(--accent-e)}
.c-dot.done{background:var(--accent-e);border-color:var(--accent-e);color:#fff}
.c-meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 8px}
.badge{font-size:10px;padding:2px 8px;border-radius:999px;background:var(--bg3);color:var(--text2);border:1px solid var(--border)}
.badge.tech{background:color-mix(in srgb,var(--accent-c) 14%,transparent);color:var(--accent-c);border-color:transparent}
.badge.warn{background:color-mix(in srgb,var(--accent-o) 14%,transparent);color:var(--accent-o);border-color:transparent}
.c-sub-list{border-top:1px dashed var(--border);margin-top:10px;padding-top:8px;display:flex;flex-direction:column;gap:5px}
.sub-row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text2);min-width:0}
.sub-dot{width:5px;height:5px;border-radius:50%;background:var(--c);opacity:.7;flex:none}
.sub-k{color:var(--text3);flex:none}
.sub-v{font-family:var(--font-mono);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-actions{display:flex;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--border)}
.act{flex:1;padding:5px 0;text-align:center;font-size:11px;border-radius:6px;border:1px solid var(--border);
  background:transparent;color:var(--text2);cursor:pointer;transition:.2s;font-family:var(--font)}
.act:hover{background:var(--surface-hover);color:var(--text);border-color:var(--border-hover)}
.act.fav{color:var(--accent-o)}
.act.fav.on{background:color-mix(in srgb,var(--accent-o) 14%,transparent);border-color:transparent;color:var(--accent-o)}

/* ===== Detail ===== */
.detail{animation:fadeUp .35s ease both}
.detail.hidden{display:none}
.back{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;
  padding:6px 12px;border-radius:999px;border:1px solid var(--border);margin-bottom:18px}
.back:hover{color:var(--text);border-color:var(--border-hover)}
.d-hero{border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-bottom:16px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c) 14%,transparent),transparent 60%)}
.d-hero h2{margin:0 0 4px;font-size:22px;word-break:break-word;overflow-wrap:anywhere}
.d-hero .p{color:var(--text2);font-size:12.5px;margin-bottom:12px}
.d-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:16px 0}
.d-box{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px}
.d-box .k{font-size:10.5px;color:var(--text3)}
.d-box .v{font-size:15px;font-family:var(--font-mono);margin-top:2px;word-break:break-word}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px}
.panel h4{margin:0 0 12px;font-size:13px;color:var(--text2);font-weight:600}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:12px}
.kv:last-child{border-bottom:none}
.kv .k{width:100px;flex:none;color:var(--text3)}
.kv .v{flex:1;word-break:break-word;font-family:var(--font-mono);font-size:11.5px}
.d-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--surface);
  color:var(--text);font-size:12px;cursor:pointer;font-family:var(--font);transition:.2s}
.btn:hover{border-color:var(--border-hover);background:var(--surface-hover)}
.btn.primary{background:linear-gradient(135deg,var(--accent-v),var(--accent-c));border-color:transparent;color:#fff;font-weight:600}

/* ===== Toast / empty ===== */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;
  background:var(--bg3);border:1px solid var(--border-hover);color:var(--text);padding:9px 18px;border-radius:999px;
  font-size:12px;transition:.25s;z-index:300;box-shadow:var(--shadow);max-width:86vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.empty{text-align:center;color:var(--text3);padding:60px 0;font-size:13px}

/* ===== Responsive ===== */
@media (max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.show{transform:translateX(0)}
  .main{margin-left:0}
  .content{padding:18px 14px 50px}
  .hero{padding:22px 18px}
  .hero h2{font-size:19px}
  .card-grid{grid-template-columns:1fr}
  .tb-clock{display:none}
  .tb-title{display:none}
  .tb-search{max-width:none}
  .topbar{padding:10px 12px;gap:7px}
  #btnExport,#btnImport,#btnReset{display:none}
  .icon-btn{width:32px;height:32px}
  .cat-desc{display:none}
  .cat-head h3{font-size:15px;white-space:nowrap}
  .cat-meta{font-size:10px;white-space:nowrap}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sb-head">
      <div class="logo">
        <div class="logo-mark">Y</div>
        <div>
          <div class="logo-t1" data-i18n="appName">YYC³ 知识库</div>
          <div class="logo-t2" data-i18n="appSub">Knowledge Base · 项目资产看板</div>
        </div>
      </div>
      <div class="sb-search"><input id="search" type="search" data-i18n-ph="searchPlaceholder" placeholder="搜索项目 / 分类 / 技术栈…" autocomplete="off"></div>
    </div>
    <div class="sb-progress">
      <div class="sp-row"><span data-i18n="overallProgress">归档进度</span><span id="spText">0 / 0</span></div>
      <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    </div>
    <nav class="sb-nav" id="nav"></nav>
    <div class="sb-foot">
      <span data-i18n="snapshot">数据快照：2026-11-10</span><br>
      <span id="footCount">0</span> <span data-i18n="unitProjects">个项目</span>
    </div>
  </aside>

  <main class="main" id="main">
    <header class="topbar">
      <button class="icon-btn" id="btnMenu" title="收起/展开侧边栏">☰</button>
      <div class="tb-title">
        <h1 id="tbTitle" data-i18n="topbarTitle">项目总览</h1>
        <p id="tbSub" data-i18n="topbarSubtitle">YYC³ Knowledge Base · 24 类项目资产</p>
      </div>
      <div class="tb-search" id="tbSearch">
        <input id="searchTop" type="search" data-i18n-ph="searchPlaceholder" placeholder="搜索项目 / 分类 / 技术栈…" autocomplete="off">
      </div>
      <span class="tb-clock" id="clock"></span>
      <a class="icon-btn" href="DGX-SPARK-HUB-OFFLINE.html" title="DGX Spark 操作中心" data-i18n-title="navDgx">🚀</a>
      <button class="icon-btn" id="btnShare" title="分享当前页面" data-i18n-title="share">📤</button>
      <button class="icon-btn" id="btnExport" title="导出归档数据" data-i18n-title="export">⬇</button>
      <button class="icon-btn" id="btnImport" title="导入归档数据" data-i18n-title="import">⬆</button>
      <button class="icon-btn" id="btnReset" title="重置归档数据" data-i18n-title="reset">↺</button>
      <button class="icon-btn lang" id="btnLang" title="切换语言 / Switch language">EN</button>
      <button class="icon-btn" id="btnTheme" title="切换主题" data-i18n-title="toggleTheme">🌙</button>
    </header>

    <section class="content">
      <div id="dashboard">
        <div class="hero">
          <h2 data-i18n="heroTitle">YYC³ 知识库 · 项目资产总览</h2>
          <p data-i18n="heroDesc">24 个分类目录 · 386 个项目 · 一次迁移完成，重复项已清零</p>
          <div class="hero-tags">
            <span class="hero-tag" data-i18n="tag1">五高架构</span><span class="hero-tag" data-i18n="tag2">五标体系</span>
            <span class="hero-tag" data-i18n="tag3">五化转型</span><span class="hero-tag" data-i18n="tag4">五维评估</span>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="filterbar">
          <button class="chip active" data-filter="all" data-i18n="filterAll">全部</button>
          <button class="chip" data-filter="todo" data-i18n="filterTodo">未归档</button>
          <button class="chip" data-filter="done" data-i18n="filterDone">已归档</button>
          <button class="chip" data-filter="fav" data-i18n="filterFav">收藏</button>
          <span class="spacer"></span>
          <select class="sel" id="sort">
            <option value="default" data-i18n="sortDefault">默认（分类 · 名称）</option>
            <option value="name" data-i18n="sortName">名称 A→Z</option>
            <option value="size" data-i18n="sortSize">体积 大→小</option>
            <option value="files" data-i18n="sortFiles">文件数 多→少</option>
          </select>
        </div>
        <div id="sections"></div>
        <div class="empty" id="empty" style="display:none" data-i18n="empty">没有匹配的项目</div>
      </div>

      <div id="detail" class="detail hidden"></div>
    </section>
  </main>
</div>

<input type="file" id="importFile" accept="application/json" hidden>

const t = (k, vars) => {
  let s = (I18N[lang] && I18N[lang][k]) != null ? I18N[lang][k] : (I18N.zh[k] != null ? I18N.zh[k] : k);
  if (vars) Object.keys(vars).forEach(v => { s = s.replace('{'+v+'}', vars[v]); });
  return s;
};

function applyLang(){
  document.documentElement.lang = I18N[lang]._code;

  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });

  $('#btnLang').textContent = I18N[lang]._label;

    if(id) openDetail(id);
  }
}

/* ---------- search ---------- */
function smartMatch(text, q){
  if(!q) return true;
  const norm = s => s.replace(/[\uff01-\uff5e]/g, c => String.fromCharCode(c.charCodeAt(0)-0xfee0)).replace(/\u3000/g,' ').toLowerCase();
  const tn = norm(text), qn = norm(q); let pos = 0;
  for(const ch of qn){ const i = tn.indexOf(ch,pos); if(i===-1){ if(tn.indexOf(ch)===-1) return false; continue; } pos = i+1; }
  return true;
}

}

  if(state.filter==='done' && !isDone(pid(p))) return false;
  if(state.filter==='todo' && isDone(pid(p))) return false;
  if(state.filter==='fav' && !isFav(pid(p))) return false;
  if(state.q && !smartMatch(pText(p), state.q)) return false;
  return true;
}
function sorted(list){
  const a=[...list];
  if(state.sort==='name') a.sort((x,y)=>x.name.localeCompare(y.name));
  else if(state.sort==='size') a.sort((x,y)=>y.mb-x.mb);
  else if(state.sort==='files') a.sort((x,y)=>y.files-x.files);
  if(state.q){
    const q=state.q.toLowerCase();
    const score=p=>{
      const n=p.name.toLowerCase(), c=p.cat.toLowerCase();
      let s=0;
      if(n===q) s+=100;
      if(n.includes(q)) s+=50;
      if(c.includes(q)) s+=20;
      if((p.tech||[]).join(' ').toLowerCase().includes(q)) s+=10;
      return s;
    };
    a.sort((x,y)=>score(y)-score(x) || x.name.localeCompare(y.name));
  }
  return a;
}
function render(){
  const secs = $('#sections'); let html='', shown=0;
  for(const c of DATA.categories){
    if(state.cat!=='all' && c.name!==state.cat) continue;
    const list = sorted(DATA.projects.filter(p=>p.cat===c.name && visible(p)));
    if(!list.length) continue;
    shown += list.length;
    html += `<section class="cat-sec" id="cat-${encodeURIComponent(c.name)}">
      <div class="cat-head">
        <span class="cat-bar" style="background:${c.color}"></span>
        <h3>${esc(c.name)}</h3>
        <span class="cat-desc">${esc(c.desc)}</span>
        <span class="cat-meta">${t('itemCount',{n:list.length})} · ${t('fileCount',{n:fmtNum(list.reduce((s,p)=>s+p.files,0))})} · ${fmtMB(list.reduce((s,p)=>s+p.mb,0))}</span>
      </div>
      <div class="card-grid">${list.map(projectCard).join('')}</div>
    </section>`;
  }
  secs.innerHTML = html;
  $('#empty').style.display = shown ? 'none' : 'block';
  updateProgress();
}
function renderStats(){
  $('#stats').innerHTML = `
    <div class="stat"><div class="k">${t('statCats')}</div><div class="v">${DATA.categories.length}<span class="u">${t('unitCat')}</span></div></div>
    <div class="stat"><div class="k">${t('statProjects')}</div><div class="v">${DATA.total}<span class="u">${t('unitProj')}</span></div></div>
    <div class="stat"><div class="k">${t('statFiles')}</div><div class="v">${fmtNum(DATA.totalFiles)}</div></div>
    <div class="stat"><div class="k">${t('statSize')}</div><div class="v">${(DATA.totalMB/1024).toFixed(2)}<span class="u">GB</span></div></div>`;
  $('#footCount').textContent = DATA.total;
}
function renderNav(){
  $('#nav').innerHTML = `<div class="nav-group">${t('navOverview')}</div>
    <div class="nav-item ${state.cat==='all'?'active':''}" data-cat="all"><span class="nav-dot" style="background:linear-gradient(135deg,#8b5cf6,#06b6d4)"></span><span class="nav-name">${t('navAll')}</span><span class="nav-count">${DATA.total}</span></div>
    <a class="nav-item jump" href="DGX-SPARK-HUB-OFFLINE.html" style="text-decoration:none"><span class="nav-dot" style="background:#f59e0b"></span><span class="nav-name">${t('navDgx')}</span><span class="nav-count">↗</span></a>
    <div class="nav-group">${t('navCategories')}</div>` +
    DATA.categories.map(c=>`<div class="nav-item ${state.cat===c.name?'active':''}" data-cat="${esc(c.name)}">
      <span class="nav-dot" style="background:${c.color}"></span>
      <span class="nav-name">${esc(c.name)}</span><span class="nav-count">${c.count}</span></div>`).join('');
  $('#nav').querySelectorAll('.nav-item[data-cat]').forEach(el=>{
    el.onclick = () => {
      state.cat = el.dataset.cat;
      if(state.cat==='all'){ location.hash=''; } else { location.hash='cat-'+encodeURIComponent(state.cat); }
      renderNav(); render();
      if(window.innerWidth<=768) $('#sidebar').classList.remove('show');
    };
  });
}
function updateProgress(){
  const total = DATA.total, done = DATA.projects.filter(p=>isDone(pid(p))).length;
  $('#spText').textContent = done+' / '+total;
  $('#spFill').style.width = total? (done/total*100).toFixed(1)+'%' : '0%';
}

/* ---------- actions ---------- */
function toggleDone(id){ const k=KEY_DONE+id; localStorage.setItem(k, localStorage.getItem(k)==='1'?'0':'1'); render(); if(!$('#detail').classList.contains('hidden')) openDetail(id); toast(localStorage.getItem(k)==='1'?t('toastArchived'):t('toastUnarchived')); }
function toggleFav(id){ const k=KEY_FAV+id; localStorage.setItem(k, localStorage.getItem(k)==='1'?'0':'1'); render(); if(!$('#detail').classList.contains('hidden')) openDetail(id); toast(localStorage.getItem(k)==='1'?t('toastFaved'):t('toastUnfaved')); }
function copyPath(id){ const p = DATA.projects.find(x=>pid(x)===id); if(!p) return;
  const text = p.path;
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(()=>toast(t('toastCopied'))); }
  else { const t2=document.createElement('textarea'); t2.value=text; document.body.appendChild(t2); t2.select(); document.execCommand('copy'); t2.remove(); toast(t('toastCopied')); }
}
function toast(msg){ const el=$('#toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(el._h); el._h=setTimeout(()=>el.classList.remove('show'),1600); }
async function sharePage(){
  const url = location.href;
  const data = { title: document.title, text: t('shareText'), url };
  try{
    if(navigator.share){ await navigator.share(data); return; }
    throw new Error('no-share');
  }catch(e){
    if(e && e.name==='AbortError') return;
    try{ await navigator.clipboard.writeText(url); toast(t('linkCopied')); }
    catch(_){ toast(url); }
  }
}

/* ---------- detail ---------- */
function openDetail(id){
  const p = DATA.projects.find(x=>pid(x)===id); if(!p) return;
  const c = catColor(p.cat), done = isDone(id), fav = isFav(id);
  $('#dashboard').style.display='none';
  const d=$('#detail'); d.classList.remove('hidden');
  d.innerHTML = `
    <span class="back" onclick="location.hash='cat-${encodeURIComponent(p.cat)}'">${t('back')} ${esc(p.cat)}</span>
    <div class="d-hero" style="--c:${c}">
      <h2>${esc(p.name)}</h2>
      <div class="p">${esc(p.cat)} · ${esc(p.desc || '—')}</div>
      <div class="c-meta">
        <span class="badge tech">${esc((p.tech||[]).join(' · ')||'—')}</span>
        ${p.v?'<span class="badge warn">'+t('variantVersion')+'</span>':'<span class="badge">'+t('mainVersion')+'</span>'}
        ${done?'<span class="badge" style="color:var(--accent-e)">'+t('badgeArchived')+'</span>':''}
        ${fav?'<span class="badge" style="color:var(--accent-o)">'+t('badgeFaved')+'</span>':''}
      </div>
      <div class="d-grid">
        <div class="d-box"><div class="k">${t('dFiles')}</div><div class="v">${fmtNum(p.files)}</div></div>
        <div class="d-box"><div class="k">${t('dSize')}</div><div class="v">${p.mb} MB</div></div>
        <div class="d-box"><div class="k">${t('dTechCount')}</div><div class="v">${(p.tech||[]).length}</div></div>
        <div class="d-box"><div class="k">${t('dManifestCount')}</div><div class="v">${(p.mans||[]).length}</div></div>
      </div>
      <div class="d-actions">
        <button class="btn primary" onclick="toggleDone('${id}')">${done?t('btnUnarchive'):t('btnArchive')}</button>
        <button class="btn" onclick="toggleFav('${id}')">${fav?'★ '+t('filterFav'):'☆ '+t('filterFav')}</button>
        <button class="btn" onclick="copyPath('${id}')">${t('copyRelPath')}</button>
      </div>
    </div>
    <div class="panel">
      <h4>${t('detailInfo')}</h4>
      <div class="kv"><span class="k">${t('dCurrent')}</span><span class="v">${esc(p.path)}</span></div>
      <div class="kv"><span class="k">${t('dOriginal')}</span><span class="v">${esc(p.orig||'—')}</span></div>
      <div class="kv"><span class="k">${t('dCategory')}</span><span class="v">${esc(p.cat)} — ${esc(p.desc||'')}</span></div>
    </div>
    <div class="panel">
      <h4>${t('dTech')}</h4>
      <div class="kv"><span class="k">${t('dExt')}</span><span class="v">${esc((p.tech||[]).join(', ')||'—')}</span></div>
      <div class="kv"><span class="k">${t('dManifests')}</span><span class="v">${esc((p.mans||[]).join(', ')||'—')}</span></div>
    </div>
    <div class="panel">
      <h4>${t('dOps')}</h4>
      <div class="kv"><span class="k">${t('dOpen')}</span><span class="v">open "${esc(p.path)}"</span></div>
      <div class="kv"><span class="k">${t('dCatIndex')}</span><span class="v">${esc(p.cat)}/README.md</span></div>
      <div class="kv"><span class="k">${t('dGovernance')}</span><span class="v">docs/YYC3-项目治理-资产盘点/README.md</span></div>
    </div>`;
  $('#tbTitle').textContent = p.name;
  $('#tbSub').textContent = p.cat + ' · ' + p.mb + ' MB';
  window.scrollTo({top:0,behavior:'smooth'});
}
function closeDetail(){
  $('#detail').classList.add('hidden');
  $('#dashboard').style.display='';
  $('#tbTitle').textContent = t('topbarTitle');
  $('#tbSub').textContent = t('topbarSubtitle');
}

/* ---------- routing ---------- */
function route(){
  const raw = location.hash.replace(/^#/,'');
  if(raw.startsWith('project-')){ openDetail(raw.slice(8)); return; }
  const h = decodeURIComponent(raw);
  closeDetail();
  if(h.startsWith('cat-')) state.cat = h.slice(4); else state.cat='all';
  renderNav(); render();
}
window.addEventListener('hashchange', route);

/* ---------- layout: 侧边栏收起时搜索上移 ---------- */
function syncSearchPos(){
  const collapsed = $('#sidebar').classList.contains('hidden') || window.innerWidth<=768;
  $('#tbSearch').classList.toggle('show', collapsed);
}

/* ---------- events ---------- */
const S1=$('#search'), S2=$('#searchTop');
S1.addEventListener('input', e=>onSearch(e.target.value));
S2.addEventListener('input', e=>onSearch(e.target.value));
$('#sort').addEventListener('change', e=>{ state.sort=e.target.value; render(); });
document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); state.filter=b.dataset.filter; render();
});
$('#btnTheme').onclick = toggleTheme;
$('#btnLang').onclick = toggleLang;
$('#btnShare').onclick = sharePage;
$('#btnMenu').onclick = ()=>{
  if(window.innerWidth<=768){ $('#sidebar').classList.toggle('show'); }
  else { $('#sidebar').classList.toggle('hidden'); $('#main').classList.toggle('wide'); }
  syncSearchPos();
};
window.addEventListener('resize', syncSearchPos);
$('#btnExport').onclick = ()=>{
  const out={version:1,exported:new Date().toISOString(),done:{},fav:{}};
  DATA.projects.forEach(p=>{ const id=pid(p); if(isDone(id)) out.done[id]=1; if(isFav(id)) out.fav[id]=1; });
  const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='yyc3-kb-progress.json'; a.click(); URL.revokeObjectURL(a.href);
  toast(t('toastExported'));
};
$('#btnImport').onclick = ()=>$('#importFile').click();
$('#importFile').onchange = e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{
    const d=JSON.parse(r.result);
    Object.keys(d.done||{}).forEach(k=>localStorage.setItem(KEY_DONE+k,'1'));
    Object.keys(d.fav||{}).forEach(k=>localStorage.setItem(KEY_FAV+k,'1'));
    render(); toast(t('toastImported'));
  }catch(err){ toast(t('toastImportFail')); } };
  r.readAsText(f); e.target.value='';
};
$('#btnReset').onclick = ()=>{
  if(!confirm(t('resetConfirm'))) return;
  DATA.projects.forEach(p=>{ localStorage.removeItem(KEY_DONE+pid(p)); localStorage.removeItem(KEY_FAV+pid(p)); });
  render(); toast(t('toastReset'));
};
function tick(){ const d=new Date(); $('#clock').textContent = d.toLocaleTimeString(lang==='zh'?'zh-CN':'en-US',{hour12:false}); }
setInterval(tick,1000); tick();

/* ---------- boot ---------- */
applyLang(); renderStats(); renderNav(); syncSearchPos(); route(); updateProgress();
</script>
</body>
</html>
