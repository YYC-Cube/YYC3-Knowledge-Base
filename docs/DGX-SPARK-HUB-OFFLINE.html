<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>DGX Spark 操作中心 · YYC³</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%238b5cf6'/%3E%3Cstop offset='100%25' stop-color='%2306b6d4'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='6' fill='url(%23g)'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-size='18' font-weight='700' font-family='sans-serif' fill='%23fff'%3ED%3C/text%3E%3C/svg%3E"
    />
    <style>
      /* ═══════════════════════════════════════════
   CSS Variables & Theme
   ═══════════════════════════════════════════ */
      :root {
        --bg: #0a0a0f;
        --bg2: #12121a;
        --bg3: #1a1a2e;
        --surface: rgba(255, 255, 255, 0.03);
        --surface-hover: rgba(255, 255, 255, 0.06);
        --border: rgba(255, 255, 255, 0.08);
        --border-hover: rgba(255, 255, 255, 0.15);
        --text: #f1f1f6;
        --text2: rgba(255, 255, 255, 0.65);
        --text3: rgba(255, 255, 255, 0.35);
        --accent-v: #8b5cf6;
        --accent-c: #06b6d4;
        --accent-e: #22c55e;
        --accent-r: #ef4444;
        --radius: 14px;
        --radius-sm: 8px;
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
        --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        --font-mono: 'SF Mono', 'Fira Code', 'Cascadia Code', 'JetBrains Mono', 'Consolas', monospace;
      }
      .light {
        --bg: #f5f5f0;
        --bg2: #e8e8e3;
        --bg3: #ddd;
        --surface: rgba(0, 0, 0, 0.02);
        --surface-hover: rgba(0, 0, 0, 0.05);
        --border: rgba(0, 0, 0, 0.08);
        --border-hover: rgba(0, 0, 0, 0.15);
        --text: #1a1a2e;
        --text2: rgba(0, 0, 0, 0.55);
        --text3: rgba(0, 0, 0, 0.3);
        --shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        font-family: var(--font);
        background: var(--bg);
        color: var(--text);
        overflow-x: hidden;
      }
      ::selection {
        background: rgba(139, 92, 246, 0.3);
        color: #fff;
      }

      /* ═══ Layout ═══ */
      .app {
        display: flex;
        min-height: 100vh;
      }

      /* ═══ Sidebar ═══ */
      .sidebar {
        width: 280px;
        flex-shrink: 0;
        background: var(--bg2);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        z-index: 100;
        transition: transform 0.3s ease;
      }
      .sidebar.hidden {
        transform: translateX(-100%);
      }
      .sb-header {
        padding: 20px 20px 16px;
        border-bottom: 1px solid var(--border);
      }
      .sb-logo {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .sb-logo-icon {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent-v), var(--accent-c));
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 16px;
        font-weight: 700;
        color: #fff;
      }
      .sb-logo-text {
        font-size: 15px;
        font-weight: 700;
        color: var(--text);
      }
      .sb-logo-sub {
        font-size: 10px;
        color: var(--text3);
        letter-spacing: 1px;
      }
      .sb-search {
        margin: 12px 16px;
        padding: 8px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        gap: 8px;
        transition: 0.2s;
      }
      .sb-search:focus-within {
        border-color: var(--accent-v);
      }
      .sb-search input {
        flex: 1;
        background: none;
        border: none;
        outline: none;
        color: var(--text);
        font-size: 13px;
      }
      .sb-search input::placeholder {
        color: var(--text3);
      }
      .sb-search svg {
        width: 14px;
        height: 14px;
        color: var(--text3);
        flex-shrink: 0;
      }

      /* ═══ Sidebar Progress ═══ */
      .sb-progress {
        margin: 0 16px 12px;
        padding: 10px 12px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .sb-progress-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 6px;
      }
      .sb-progress-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--text3);
      }
      .sb-progress-pct {
        font-size: 11px;
        font-weight: 700;
        color: var(--accent-v);
      }
      .sb-progress-bar {
        height: 4px;
        border-radius: 2px;
        background: var(--border);
        overflow: hidden;
        margin-bottom: 4px;
      }
      .sb-progress-fill {
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, var(--accent-v), var(--accent-c));
        transition: width 0.6s ease;
      }
      .sb-progress-count {
        font-size: 10px;
        color: var(--text3);
      }
      .sb-nav {
        flex: 1;
        overflow-y: auto;
        padding: 8px 12px 80px;
      }
      .sb-nav::-webkit-scrollbar {
        width: 3px;
      }
      .sb-nav::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 2px;
      }
      .sb-group {
        margin-bottom: 16px;
      }
      .sb-group-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1.2px;
        color: var(--text3);
        padding: 0 8px;
        margin-bottom: 4px;
      }
      .sb-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 8px;
        border-radius: 6px;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.15s;
        text-decoration: none;
        position: relative;
      }
      .sb-item:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .sb-item.active {
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
      }
      .sb-item .sb-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        flex-shrink: 0;
        background: var(--text3);
        transition: 0.3s;
      }
      .sb-item .sb-dot.done {
        background: var(--accent-e);
        box-shadow: 0 0 6px rgba(34, 197, 94, 0.4);
      }
      .sb-item .sb-dot.ext {
        background: rgba(99, 102, 241, 0.5);
        border: 1px solid rgba(99, 102, 241, 0.3);
      }
      .sb-item .sb-label {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .sb-item .sb-order {
        font-size: 9px;
        color: var(--text3);
        font-weight: 600;
        width: 16px;
        text-align: right;
      }

      /* ═══ Main ═══ */
      .main {
        flex: 1;
        margin-left: 280px;
        min-height: 100vh;
        transition: margin-left 0.3s ease;
      }
      .main.expanded {
        margin-left: 0;
      }

      /* ═══ Top bar ═══ */
      .topbar {
        position: sticky;
        top: 0;
        z-index: 50;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 24px;
        background: rgba(10, 10, 15, 0.8);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .light .topbar {
        background: rgba(245, 245, 240, 0.8);
      }
      .topbar-title {
        font-size: 16px;
        font-weight: 600;
      }
      .topbar-subtitle {
        font-size: 12px;
        color: var(--text3);
      }
      .topbar-spacer {
        flex: 1;
      }
      /* Topbar search — hidden by default, shown when sidebar collapsed */
      .topbar-search {
        display: none;
        flex: 1;
        max-width: 320px;
        position: relative;
      }
      .main.expanded .topbar-search {
        display: block;
      }
      .topbar-search input {
        width: 100%;
        padding: 6px 12px 6px 32px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        font-size: 13px;
        outline: none;
        transition: 0.2s;
        font-family: inherit;
      }
      .topbar-search input:focus {
        border-color: var(--accent-v);
        background: var(--bg2);
      }
      .topbar-search input::placeholder {
        color: var(--text3);
      }
      .topbar-search .ts-icon {
        position: absolute;
        left: 10px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text3);
        font-size: 13px;
        pointer-events: none;
      }
      /* Topbar time widget */
      .topbar-time {
        display: none;
        align-items: center;
        gap: 5px;
        font-size: 12px;
        color: var(--text2);
        font-family: var(--mono);
        padding: 4px 10px;
        border-radius: 6px;
        background: var(--surface);
        border: 1px solid var(--border);
        user-select: none;
        white-space: nowrap;
      }
      .main.expanded .topbar-time {
        display: flex;
      }
      .topbar-time .tt-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent-e);
        animation: pulse-dot 2s ease infinite;
      }
      @keyframes pulse-dot {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }
      /* Share button */
      .btn-share {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-share:hover {
        background: var(--surface-hover);
        color: var(--accent-v);
        border-color: rgba(139, 92, 246, 0.3);
      }
      .topbar-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .btn-theme,
      .btn-menu {
        width: 34px;
        height: 34px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-theme:hover,
      .btn-menu:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-theme svg {
        width: 16px;
        height: 16px;
      }
      .progress-actions {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .btn-action {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: 0.2s;
      }
      .btn-action:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .btn-action.btn-danger:hover {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
        border-color: rgba(239, 68, 68, 0.3);
      }

      /* ═══ Dashboard ═══ */
      .dashboard {
        padding: 24px;
        max-width: 1400px;
        margin: 0 auto;
      }
      .dash-header {
        margin-bottom: 32px;
      }
      .dash-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 4px 12px;
        border-radius: 20px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--accent-v);
        font-size: 11px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .dash-title {
        font-size: 28px;
        font-weight: 700;
        margin-bottom: 6px;
        line-height: 1.2;
      }
      .dash-desc {
        font-size: 14px;
        color: var(--text2);
        max-width: 600px;
        line-height: 1.5;
      }
      .dash-stats {
        display: flex;
        gap: 16px;
        margin-top: 20px;
        flex-wrap: wrap;
      }
      .stat-card {
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .stat-num {
        font-size: 20px;
        font-weight: 700;
      }
      .stat-label {
        font-size: 11px;
        color: var(--text2);
      }

      /* ═══ Filter bar ═══ */
      .filter-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 24px;
      }
      .filter-btn {
        padding: 6px 14px;
        border-radius: 20px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--text2);
        font-size: 12px;
        cursor: pointer;
        transition: 0.2s;
        font-weight: 500;
      }
      .filter-btn:hover {
        border-color: var(--border-hover);
        color: var(--text);
      }
      .filter-btn.active {
        background: var(--accent-v);
        color: #fff;
        border-color: var(--accent-v);
      }
      .filter-btn[data-cat='all'].active {
        background: var(--text);
        color: var(--bg);
        border-color: var(--text);
      }

      /* ═══ Category section ═══ */
      .cat-section {
        margin-bottom: 36px;
      }
      .cat-header {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 14px;
      }
      .cat-icon {
        font-size: 20px;
      }
      .cat-name {
        font-size: 16px;
        font-weight: 600;
      }
      .cat-count {
        font-size: 12px;
        color: var(--text3);
      }
      .cat-line {
        flex: 1;
        height: 1px;
        background: var(--border);
      }

      /* ═══ Card grid ═══ */
      .card-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 14px;
      }
      .guide-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 18px;
        cursor: pointer;
        transition: all 0.25s ease;
        text-decoration: none;
        display: block;
        color: inherit;
        position: relative;
        overflow: hidden;
        animation: fadeUp 0.4s ease both;
      }
      .guide-card:hover {
        transform: translateY(-2px);
        border-color: var(--border-hover);
        box-shadow: var(--shadow);
      }
      .guide-card.hidden {
        display: none;
      }
      .guide-card .gc-bar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
      }
      .gc-head {
        display: flex;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 10px;
      }
      .gc-icon {
        width: 38px;
        height: 38px;
        border-radius: 10px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 18px;
      }
      .gc-info {
        flex: 1;
        min-width: 0;
      }
      .gc-title {
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 2px;
        line-height: 1.3;
      }
      .gc-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .gc-tag {
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 4px;
        font-weight: 600;
      }
      .gc-tag.easy {
        background: rgba(34, 197, 94, 0.12);
        color: #22c55e;
      }
      .gc-tag.medium {
        background: rgba(245, 158, 11, 0.12);
        color: #f59e0b;
      }
      .gc-tag.hard {
        background: rgba(239, 68, 68, 0.12);
        color: #ef4444;
      }
      .gc-time {
        font-size: 10px;
        color: var(--text3);
      }
      .gc-desc {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.5;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }
      .gc-tags {
        display: flex;
        gap: 4px;
        flex-wrap: wrap;
        margin-top: 8px;
      }
      .gc-tags span {
        font-size: 9px;
        padding: 2px 6px;
        border-radius: 4px;
        background: var(--surface);
        color: var(--text3);
        border: 1px solid var(--border);
      }
      .gc-check {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 2px solid var(--border);
        cursor: pointer;
        transition: 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }
      .gc-check.done {
        background: var(--accent-e);
        border-color: var(--accent-e);
      }
      .gc-check.done::after {
        content: '✓';
        color: #fff;
        font-size: 11px;
        font-weight: 700;
      }

      /* ═══ Guide Detail ═══ */
      .guide-detail {
        display: none;
        padding: 24px;
        max-width: 900px;
        margin: 0 auto;
      }
      .guide-detail.active {
        display: block;
      }
      .gd-back {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 14px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text2);
        cursor: pointer;
        font-size: 12px;
        transition: 0.2s;
        text-decoration: none;
        margin-bottom: 20px;
      }
      .gd-back:hover {
        background: var(--surface-hover);
        color: var(--text);
      }
      .gd-hero {
        padding: 24px;
        border-radius: var(--radius);
        background: var(--surface);
        border: 1px solid var(--border);
        margin-bottom: 24px;
      }
      .gd-hero-top {
        display: flex;
        align-items: flex-start;
        gap: 14px;
        margin-bottom: 12px;
      }
      .gd-hero-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
      }
      .gd-hero-info {
        flex: 1;
      }
      .gd-hero-title {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 4px;
      }
      .gd-hero-desc {
        font-size: 13px;
        color: var(--text2);
        line-height: 1.5;
      }
      .gd-hero-meta {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .gd-hero-meta span {
        font-size: 12px;
        color: var(--text3);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .gd-prereq {
        margin-bottom: 24px;
        padding: 16px 20px;
        border-radius: var(--radius-sm);
        background: var(--surface);
        border: 1px solid var(--border);
      }
      .gd-prereq-title {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 8px;
        color: var(--text2);
      }
      .gd-prereq ul {
        padding-left: 16px;
      }
      .gd-prereq li {
        font-size: 12px;
        color: var(--text2);
        line-height: 1.7;
      }

      /* ═══ Steps ═══ */
      .step {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        margin-bottom: 12px;
        overflow: hidden;
        background: var(--surface);
        transition: 0.2s;
      }
      .step:hover {
        border-color: var(--border-hover);
      }
      .step.destructive {
        border-left: 3px solid #ef4444;
      }
      .step-head {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 18px;
        cursor: pointer;
        user-select: none;
      }
      .step-num {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        transition: 0.2s;
        cursor: pointer;
      }
      .step-num:hover {
        transform: scale(1.1);
      }
      .step-num-done {
        background: #22c55e !important;
        box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
      }
      .step-title-done {
        text-decoration: line-through;
        opacity: 0.5;
      }
      .step-title {
        flex: 1;

  // ═══════════════════════════════════════════
  // AI Workbench 容器化推理部署 (专精指南)

  {
    id: 'g45', order: 63, cat: 'inference', title: 'AI Workbench 容器化推理部署', titleEn: 'AI Workbench Inference', diff: 'hard', time: '80 min', icon: '🔧', color: '#f59e0b', desc: 'NVIDIA AI Workbench 容器化部署 DGX-Model-Manager + vLLM/SGLang/LiteLLM 多引擎推理平台。4TB 大内存专属优化，含八大配置面板逐项操作 + 高频报错全集。', prereq: ['AI Workbench 已安装', 'Docker', 'NVIDIA GPU'], overview: [['平台', 'AI Workbench'], ['推理引擎', 'DGX-Model-Manager / vLLM / SGLang / LiteLLM'], ['端口', '8090(管理)/11434(Ollama)/4000(LiteLLM)/30000(SGLang)/8000(vLLM)'], ['共享内存', '16384 MB (推荐)']], steps: [
      { n: 1, title: '主机预处理 & 创建目录', time: '5 min', content: '在主机创建模型持久化目录，避免嵌套挂载。', code: [['bash', '# 主机终端执行\nmkdir -p /home/yyc3/ai_models']] },
      { n: 2, title: 'Base 镜像 + 依赖包配置', time: '10 min', content: '选用 PyTorch 2.11 + CUDA 13.1 官方镜像，添加系统工具。', code: [['bash', '# Base: PyTorch 2.11 Base with CUDA 13.1 | Ubuntu24.04 | Python3\n# Packages: curl / git / git-lfs (apt)']] },
      { n: 3, title: 'preBuild + postBuild 脚本配置', time: '15 min', content: '粘贴清华源加速脚本，创建推理引擎目录。', code: [['bash', '# preBuild.bash — 替换 apt 源为清华镜像\nsed -i \'s/archive.ubuntu.com/mirrors.tuna.tsinghua.edu.cn/g\' /etc/apt/sources.list\napt update -y && apt install -y curl git git-lfs\n\n# postBuild.bash — 创建推理引擎工作目录\nmkdir -p /project/SGLang /project/vLLM /project/llama.cpp /project/litellm /model_cache\npip install fastapi uvicorn httpx pyyaml huggingface_hub\nchown -R 1000:1000 /project && chmod -R 755 /project/*']] },
      { n: 4, title: '挂载 + 硬件 + 端口配置（核心）', time: '20 min', content: '三类挂载：docker.sock（引擎启停）、模型持久化（/model_cache）、项目目录。GPU + 共享内存 16384MB + 7 个推理端口转发。', code: [['bash', '# Host Mount 1: docker.sock\n#   Source: /var/run/docker.sock → Target: /var/run/docker.sock\n\n# Host Mount 2: 模型持久化\n#   Source: /home/yyc3/ai_models → Target: /model_cache\n\n# Ports:\n#   8090(DGX-Manager) 11434(Ollama) 4000(LiteLLM)\n#   30000(SGLang) 8000(vLLM) 8080(llama.cpp) 8188(ComfyUI)\n\n# Hardware: Shared Memory → 16384 MB']] },
      { n: 5, title: '容器构建 & 校验', time: '15 min', content: 'Start Build → Running 状态确认。重点校验挂载和 docker.sock。', code: [['bash', '# 容器内校验\npwd              # → /project\nls /model_cache  # 无报错=挂载正常\ndocker ps        # 列出主机容器=docker.sock生效']] },
      { n: 6, title: 'DGX-Model-Manager 部署', time: '15 min', content: '克隆项目 → setup.sh → 后台常驻启动管理后台。', code: [['bash', 'git clone https://github.com/calico88x/DGX-Model-Manager.git\ncd DGX-Model-Manager\ncp config.example.json config.json\nbash setup.sh\n# 交互: 创建 venv=Y / UFW=N / systemd=N\nsource venv/bin/activate\nnohup python3 app.py > app.log 2>&1 &\n# 访问 http://服务器IP:8090']] }
    ]
  },

    <!-- ═══ Preview Modal ═══ -->
    <div class="modal-overlay" id="previewModal" onclick="if (event.target === this) closePreviewModal();">
      <div class="modal-box">
        <div class="modal-header">
          <div class="modal-title" id="modalTitle">📋 步骤预览</div>
          <button class="modal-close" onclick="closePreviewModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
    <script>
      /* ══════════════════════════════════════════════════
   Application Logic
   ══════════════════════════════════════════════════ */
      let currentGuide = null;
      let currentFilter = 'all';
      let searchQuery = '';

      /* ═══ Theme ═══ */
      function toggleTheme() {
        const isLight = document.documentElement.classList.toggle('light');
        const icon = document.getElementById('themeIcon');
        if (isLight) {
          icon.innerHTML =
            '<path d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707"/><circle cx="12" cy="12" r="4"/>';
        } else {
          icon.innerHTML = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>';
        }
        localStorage.setItem('theme', isLight ? 'light' : 'dark');
      }
      function initTheme() {
        if (localStorage.getItem('theme') === 'light') toggleTheme();
      }
      initTheme();

      /* ═══ Sidebar ═══ */
      function toggleSidebar() {
        document.getElementById('sidebar').classList.toggle('hidden');
        document.getElementById('sbOverlay').classList.toggle('show');
        document.getElementById('main').classList.toggle('expanded');
      }

      /* ═══ Sidebar Navigation ═══ */
      function buildSidebar() {
        if (!GUIDES) return;
        const nav = document.getElementById('sbNav');
        const catLabels = getCategoryLabels();
        const groups = {};
        GUIDES.forEach((g) => {
          if (!groups[g.cat]) groups[g.cat] = [];
          groups[g.cat].push(g);
        });
        let html = '';
        Object.entries(groups).forEach(([cat, guides]) => {
          html += `<div class="sb-group"><div class="sb-group-title">${catLabels[cat] || cat}</div>`;
          guides.forEach((g) => {
            const done = localStorage.getItem('guide-done-' + g.id) === '1';
            if (g.type === 'external') {
              html += `<a class="sb-item" href="${escHtml(g.externalUrl)}" target="_blank" rel="noopener" data-id="${g.id}">
        <span class="sb-dot ext"></span>
        <span class="sb-label">${g.order}. ${g.title}</span>
        <span class="sb-order">↗</span>
      </a>`;
            } else {
              html += `<a class="sb-item" href="#" onclick="showGuide('${g.id}')" data-id="${g.id}">
        <span class="sb-dot ${done ? 'done' : ''}"></span>
        <span class="sb-label">${g.order}. ${g.title}</span>
        <span class="sb-order">${diffIcon(g.diff)}</span>
      </a>`;
            }
          });
          html += '</div>';
        });
        nav.innerHTML = html;
        updateSidebarProgress();
      }

      function diffIcon(d) {
        if (d === 'easy') return '★';
        if (d === 'medium') return '★★';
        return '★★★';
      }

      function filterSidebar(q) {
        searchQuery = q.toLowerCase().trim();
        document.querySelectorAll('.sb-item').forEach((el) => {
          const label = el.querySelector('.sb-label')?.textContent?.toLowerCase() || '';
          el.style.display = label.includes(searchQuery) ? '' : 'none';
        });
        // Also update sidebar group visibility
        document.querySelectorAll('.sb-group').forEach((grp) => {
          const visible = [...grp.querySelectorAll('.sb-item')].some((el) => el.style.display !== 'none');
          grp.style.display = visible ? '' : 'none';
        });
        // Sync with dashboard if visible
        const dashboard = document.getElementById('dashboardView');
        if (dashboard.style.display !== 'none') {
          applyFilters();
        }
        // Also filter skills panel if visible
        const sp = document.getElementById('skillsPanel');
        if (sp.style.display !== 'none' && typeof filterSkills === 'function') {
          filterSkills(q);
        }
      }

      /* ═══ Topbar Search Sync ═══ */
      function topbarSearch(val) {
        // Sync sidebar search value
        const sbInput = document.getElementById('sbSearchInput');
        if (sbInput) sbInput.value = val;
        filterSidebar(val);
      }
      // Sync sidebar search back to topbar when sidebar is visible
      document.addEventListener('DOMContentLoaded', () => {
        const sbInput = document.getElementById('sbSearchInput');
        if (sbInput) {
          sbInput.addEventListener('input', () => {
            const tbInput = document.getElementById('topbarSearchInput');
            if (tbInput) tbInput.value = sbInput.value;
          });
        }
      });

      /* ═══ Clock Widget ═══ */
      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const el = document.getElementById('clockDisplay');
        if (el) el.textContent = h + ':' + m + ':' + s;
      }

      /* ═══ Share Page ═══ */
      function sharePage() {
        const url = window.location.href;
        const title = document.getElementById('topbarTitle').textContent;
        if (navigator.share) {
          navigator.share({ title: title, url: url }).catch(() => {});
        } else if (navigator.clipboard) {
          navigator.clipboard.writeText(url).then(() => {
            const btn = document.querySelector('.btn-share');
            const orig = btn.innerHTML;
            btn.innerHTML =
              '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>';
            btn.title = '已复制链接';
            setTimeout(() => {
              btn.innerHTML = orig;
              btn.title = '分享当前页面';
            }, 2000);
          });
        }
      }

      /* ═══ Dashboard ═══ */
      function showDashboard() {
        document.getElementById('guideDetail').classList.remove('active');
        document.getElementById('guideDetail').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('topbarTitle').textContent = 'DGX Spark 操作中心';
        document.getElementById('topbarSubtitle').textContent = 'NVIDIA 官方集成操作指南';
        window.location.hash = '';
        currentGuide = null;
        document.querySelectorAll('.sb-item').forEach((el) => el.classList.remove('active'));
      }

      function getCategoryLabels() {
        return {
          'getting-started': '🚀 入门配置',
          inference: '⚡ 推理引擎',
          finetuning: '🎯 模型微调',
          cluster: '🔗 集群互联',
          quantization: '📉 模型量化',
          'ai-application': '🤖 AI 应用',
          'data-science': '📊 数据科学',
          development: '🛠️ 开发工具',
          security: '🛡️ 安全沙箱',
          'github-repos': '📦 GitHub 仓库',
          'nvidia-docs': '📘 NVIDIA 官方资源',
          'mid-term': '🔶 中期可选',

      /* ═══ Filters ═══ */

        btn.classList.add('active');

        // Show/hide skills panel vs dashboard
        const sp = document.getElementById('skillsPanel');
        const dc = document.getElementById('dashboardContent');
        const ds = document.getElementById('dashStats');
        const gc = document.getElementById('guideCount');
        if (cat === 'skills') {
          dc.style.display = 'none';
          sp.style.display = 'block';
          ds.style.display = 'none';
          gc.textContent = (typeof SKILLS !== 'undefined' ? SKILLS.length : 0) + ' 条 NVIDIA Skills';
          if (sp.innerHTML === '') renderSkillsPanel();
        } else {
          dc.style.display = '';
          sp.style.display = 'none';
          ds.style.display = '';
          applyFilters();
        }
      }

        const cards = document.querySelectorAll('.guide-card');
        const sections = document.querySelectorAll('.cat-section');
        cards.forEach((card) => {
          const cat = card.dataset.cat;
          const diff = card.dataset.diff;
          const title = card.querySelector('.gc-title')?.textContent?.toLowerCase() || '';
          const matchesCat = currentFilter === 'all' || cat === currentFilter;
          const matchesSearch = !searchQuery || title.includes(searchQuery);
          card.classList.toggle('hidden', !(matchesCat && matchesSearch));
        });
        sections.forEach((sec) => {
          const visible = [...sec.querySelectorAll('.guide-card')].some((c) => !c.classList.contains('hidden'));
          sec.style.display = visible ? '' : 'none';
        });
      }

      /* ═══ Skills Search ═══ */
      function filterSkills(q) {
        var query = q.toLowerCase().trim();
        var cards = document.querySelectorAll('#skillsPanel .skill-card');
        var sections = document.querySelectorAll('#skillsPanel .skills-cat');
        var visibleCount = 0;

        cards.forEach(function (c) {
          var txt = (c.querySelector('.sk-name')?.textContent || '') + (c.querySelector('.sk-desc')?.textContent || '');
          var match = !query || txt.toLowerCase().includes(query);
          c.classList.toggle('hidden-by-search', !match);
          if (match) visibleCount++;
        });

        sections.forEach(function (sec) {
          var visible = [...sec.querySelectorAll('.skill-card')].some(function (c) {
            return !c.classList.contains('hidden-by-search');
          });
          sec.style.display = visible ? '' : 'none';
        });

        // Show/hide empty state
        var empty = sp.querySelector('.skills-empty');
        if (visibleCount === 0) {
          if (!empty) {
            var e = document.createElement('div');
            e.className = 'skills-empty';
            e.textContent = '🔍 未找到匹配的技能条目';
            sp.appendChild(e);
          }
        } else if (empty) {
          empty.remove();
        }
      }

      /* ═══ Done toggle ═══ */
      function toggleDone(id) {
        const key = 'guide-done-' + id;
        const isDone = localStorage.getItem(key) === '1';
        localStorage.setItem(key, isDone ? '0' : '1');
        renderDashboard();
        buildSidebar();
        updateSidebarProgress();
      }

      function updateSidebarDots() {
        document.querySelectorAll('.sb-item').forEach((el) => {
          const id = el.dataset.id;
          const dot = el.querySelector('.sb-dot');
          if (id && dot) {
            dot.classList.toggle('done', localStorage.getItem('guide-done-' + id) === '1');
          }
        });
      }

      /* ═══ Sidebar Progress ═══ */
      function updateSidebarProgress() {
        if (!GUIDES || !GUIDES.length) return;
        const total = GUIDES.length;
        const done = GUIDES.filter((g) => localStorage.getItem('guide-done-' + g.id) === '1').length;
        const pct = Math.round((done / total) * 100);
        document.getElementById('sbProgressPct').textContent = pct + '%';
        document.getElementById('sbProgressFill').style.width = pct + '%';
        document.getElementById('sbProgressCount').textContent = done + ' / ' + total + ' 已完成';
      }

      /* ═══ Preview Modal ═══ */
      function openPreviewModal(id) {
        if (!GUIDES) return;
        const guide = GUIDES.find((g) => g.id === id);
        if (!guide || !guide.steps) return;
        const catColors = getCategoryColors();
        const catColor = catColors[guide.cat] || '#666';
        document.getElementById('modalTitle').textContent = `${guide.icon || '📋'} ${guide.title} — 步骤预览`;
        const body = document.getElementById('modalBody');
        body.innerHTML = guide.steps
          .map((s) => {
            const sDone = localStorage.getItem('step-done-' + id + '-' + s.n) === '1';

            <div class="ms-info">

        document.getElementById('previewModal').classList.remove('show');
      }

      /* ═══ Progress Export/Reset ═══ */
      function exportProgress() {
        if (!GUIDES) return;
        const data = {
          exportTime: new Date().toISOString(),
          total: GUIDES.length,
          guides: GUIDES.map((g) => ({
            id: g.id,
            title: g.title,
            done: localStorage.getItem('guide-done-' + g.id) === '1',
            steps: g.steps
              ? g.steps.map((s) => ({
                  n: s.n,
                  title: s.title,
                  done: localStorage.getItem('step-done-' + g.id + '-' + s.n) === '1',
                  open: localStorage.getItem('step-open-' + g.id + '-' + s.n) === '1',
                }))
              : [],
          })),
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'dgx-spark-progress-' + new Date().toISOString().slice(0, 10) + '.json';
        a.click();
        URL.revokeObjectURL(url);
      }

      function importProgress() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = '.json';
        input.onchange = function (e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function (ev) {
            try {
              const data = JSON.parse(ev.target.result);
              if (!data.guides || !Array.isArray(data.guides)) throw new Error('无效格式');
              data.guides.forEach((g) => {
                if (g.id) {
                  localStorage.setItem('guide-done-' + g.id, g.done ? '1' : '0');
                  if (g.steps) {
                    g.steps.forEach((s) => {
                      localStorage.setItem('step-done-' + g.id + '-' + s.n, s.done ? '1' : '0');
                      localStorage.setItem('step-open-' + g.id + '-' + s.n, s.open ? '1' : '0');
                    });
                  }
                }
              });
              renderDashboard();
              buildSidebar();
              updateSidebarProgress();
              alert('✅ 进度导入成功！');
            } catch (err) {
              alert('❌ 导入失败：' + err.message);
            }
          };
          reader.readAsText(file);
        };
        input.click();
      }

      function resetProgress() {
        if (!confirm('确定重置所有进度？此操作不可撤销。')) return;
        if (!GUIDES) return;
        GUIDES.forEach((g) => {
          localStorage.removeItem('guide-done-' + g.id);
          if (g.steps) {
            g.steps.forEach((s) => {
              localStorage.removeItem('step-done-' + g.id + '-' + s.n);
              localStorage.removeItem('step-open-' + g.id + '-' + s.n);
            });
          }
        });
        renderDashboard();
        buildSidebar();
        updateSidebarProgress();
      }

      /* ═══ Show Guide ═══ */
      function showGuide(id, stepN) {
        if (!GUIDES) return;
        const guide = GUIDES.find((g) => g.id === id);
        if (!guide) return;
        currentGuide = guide;
        document.getElementById('dashboardView').style.display = 'none';
        const detail = document.getElementById('guideDetail');
        detail.style.display = 'block';
        detail.classList.add('active');
        document.getElementById('topbarTitle').textContent = guide.title;
        document.getElementById('topbarSubtitle').textContent = guide.titleEn || '';

        const stepsDone = guide.steps
          ? guide.steps.filter((s) => localStorage.getItem('step-done-' + id + '-' + s.n) === '1').length
          : 0;
        const totalSteps = guide.steps ? guide.steps.length : 0;
        const pct = totalSteps > 0 ? Math.round((stepsDone / totalSteps) * 100) : 0;
        const catColors = getCategoryColors();
        const catColor = catColors[guide.cat] || '#666';

        let stepsHtml = '';
        if (guide.steps) {
          guide.steps.forEach((s) => {
            const collapsed = localStorage.getItem('step-open-' + id + '-' + s.n) !== '1';
            const stepDone = localStorage.getItem('step-done-' + id + '-' + s.n) === '1';
            // Auto-open target step
            const shouldOpen = !collapsed || (stepN && s.n === stepN);
            stepsHtml += `<div class="step ${s.isDestructive ? 'destructive' : ''} ${shouldOpen ? 'open' : ''}" data-step="${s.n}">
        <div class="step-head" onclick="toggleStep('${id}',${s.n})">
          <div class="step-num ${stepDone ? 'step-num-done' : ''}" style="background:${stepDone ? '#22c55e' : catColor}" onclick="event.stopPropagation();toggleStepDone('${id}',${s.n})">${stepDone ? '✓' : s.n}</div>
          <span class="step-title ${stepDone ? 'step-title-done' : ''}">${s.title}</span>
          <span class="step-time">⏱ ${s.time || ''}</span>
          <span class="step-toggle">▶</span>
        </div>
        <div class="step-body">
          <div class="step-body-inner">
            <div class="step-content"><p>${s.content || ''}</p></div>
            ${s.code ? s.code.map((c) => `<div class="code-block"><div class="code-hdr"><span>${c[0]}</span><button class="copy-btn" onclick="copyCode(this,'${escHtml(c[1])}')">📋 复制</button></div><pre>${escHtml(c[1])}</pre></div>`).join('') : ''}
            ${s.warning ? `<div class="step-warning">⚠️ ${s.warning}</div>` : ''}
            ${s.tip ? `<div class="step-tip">💡 ${s.tip}</div>` : ''}
          </div>
        </div>
      </div>`;
          });
        }

        let prereqHtml = '';
        if (guide.prereq && guide.prereq.length > 0) {
          prereqHtml = `<div class="gd-prereq"><div class="gd-prereq-title">📋 前置条件</div><ul>${guide.prereq.map((p) => `<li>${p}</li>`).join('')}</ul></div>`;
        }

        let overviewHtml = '';
        if (guide.overview && guide.overview.length > 0) {
          overviewHtml = guide.overview.map((o) => `<span>${o[0]}: ${o[1]}</span>`).join('');
        }

        detail.innerHTML = `
    <a class="gd-back" href="#" onclick="showDashboard();return false;">← 返回操作中心</a>
    <div class="gd-hero">
      <div class="gd-hero-top">
        <div class="gd-hero-icon" style="background:${catColor}22">${guide.icon || '📄'}</div>
        <div class="gd-hero-info">
          <div class="gd-hero-title">${guide.title}</div>
          <div class="gd-hero-desc">${guide.desc || ''}</div>
          <div class="gd-hero-meta">
            <span>📂 ${getCategoryLabels()[guide.cat] || guide.cat}</span>
            <span>📊 ${guide.diff === 'easy' ? '⭐ 简单' : guide.diff === 'medium' ? '⭐⭐ 中等' : '⭐⭐⭐ 高'}</span>
            ${overviewHtml}
          </div>
        </div>
      </div>
    </div>
    <div class="gd-progress">
      <span>📊 进度</span>
      <div class="gd-progress-bar"><div class="gd-progress-fill" style="width:${pct}%"></div></div>
      <span class="gd-progress-text">${stepsDone}/${totalSteps} 步 (${pct}%)</span>
    </div>
    ${prereqHtml}
    <div class="gd-steps">${stepsHtml}</div>
  `;

        document.getElementById('sidebar').classList.add('hidden');
        document.getElementById('sbOverlay').classList.remove('show');
        document.getElementById('main').classList.add('expanded');
        document.querySelectorAll('.sb-item').forEach((el) => {
          el.classList.toggle('active', el.dataset.id === id);
        });
        window.location.hash = 'guide-' + id + (stepN ? '-step-' + stepN : '');
        // Auto-scroll to target step
        if (stepN) {
          setTimeout(() => {
            const el = document.querySelector(`.step[data-step="${stepN}"]`);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          }, 150);
        }
      }

      function toggleStep(id, n) {
        const step = document.querySelector(`.step[data-step="${n}"]`);
        if (!step) return;
        step.classList.toggle('open');
        localStorage.setItem('step-open-' + id + '-' + n, step.classList.contains('open') ? '1' : '0');
      }

      function toggleStepDone(id, n) {
        const key = 'step-done-' + id + '-' + n;
        const isDone = localStorage.getItem(key) === '1';
        localStorage.setItem(key, isDone ? '0' : '1');
        // Refresh progress display without full re-render
        const guide = currentGuide;
        if (guide && guide.id === id) {
          const stepsDone = guide.steps
            ? guide.steps.filter((s) => localStorage.getItem('step-done-' + id + '-' + s.n) === '1').length
            : 0;
          const totalSteps = guide.steps ? guide.steps.length : 0;
          const pct = totalSteps > 0 ? Math.round((stepsDone / totalSteps) * 100) : 0;
          const fill = document.querySelector('.gd-progress-fill');
          const text = document.querySelector('.gd-progress-text');
          if (fill) fill.style.width = pct + '%';
          if (text) text.textContent = stepsDone + '/' + totalSteps + ' 步 (' + pct + '%)';
        }
        // Update step visuals
        const step = document.querySelector(`.step[data-step="${n}"]`);
        if (step) {
          const num = step.querySelector('.step-num');
          const title = step.querySelector('.step-title');
          const newDone = localStorage.getItem(key) === '1';
          if (num) {
            num.textContent = newDone ? '✓' : n;
            num.style.background = newDone ? '#22c55e' : currentGuide ? getCategoryColors()[currentGuide.cat] : '#666';
            num.classList.toggle('step-num-done', newDone);
          }
          if (title) title.classList.toggle('step-title-done', newDone);
        }
      }

      function copyCode(btn, code) {
        navigator.clipboard
          .writeText(code)
          .then(() => {
            btn.textContent = '✅ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = '📋 复制';
              btn.classList.remove('copied');
            }, 2000);
          })
          .catch(() => {
            const ta = document.createElement('textarea');
            ta.value = code;
            document.body.appendChild(ta);
            ta.select();
            document.execCommand('copy');
            document.body.removeChild(ta);
            btn.textContent = '✅ 已复制';
            btn.classList.add('copied');
            setTimeout(() => {
              btn.textContent = '📋 复制';
              btn.classList.remove('copied');
            }, 2000);
          });
      }

      function escHtml(s) {
        if (!s) return '';
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }

      /* ═══ Hash routing ═══ */
      function parseGuideHash(hash) {
        if (!hash.startsWith('guide-')) return null;
        const rest = hash.replace('guide-', '');
        // Match: g01-step-3 → id=g01, stepN=3
        const match = rest.match(/^([^-]+)-step-(\d+)$/);
        if (match) return { id: match[1], stepN: parseInt(match[2]) };
        return { id: rest, stepN: null };
      }
      window.addEventListener('hashchange', () => {
        const hash = window.location.hash.replace('#', '');
        const parsed = parseGuideHash(hash);
        if (parsed) {
          if (GUIDES) showGuide(parsed.id, parsed.stepN);
        } else {
          showDashboard();
        }
      });

      /* ═══ Init ═══ */
      function init() {
        // Start clock
        updateClock();
        setInterval(updateClock, 1000);
        if (typeof GUIDES !== 'undefined' && GUIDES.length) {
          buildSidebar();
          renderDashboard();
          // Check hash on load
          const hash = window.location.hash.replace('#', '');
          const parsed = parseGuideHash(hash);
          if (parsed) {
            setTimeout(() => showGuide(parsed.id, parsed.stepN), 100);
          }
        } else {
          // Poll for data
          let attempts = 0;
          const check = setInterval(() => {
            if (typeof GUIDES !== 'undefined' && GUIDES.length) {
              clearInterval(check);
              buildSidebar();
              renderDashboard();
            }
            if (++attempts > 50) clearInterval(check);
          }, 200);
        }
      }

      // Wait for DOM + script load
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }
    </script>
  </body>
</html>
